---
# Security / HackTheBox tooling
# Vorbild: base-Rolle. Installiert gängige Tools für HTB-Boxen (Recon, Web,
# Passwörter, Exploitation, Binary/Pwn) plus Wordlists.

- name: Ensure ~/tools directory exists (für git-basierte Tools)
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/tools"
    state: directory
    mode: "0755"

- name: Install recon & enumeration packages
  become: true
  dnf:
    name:
      - gobuster
      - ffuf
      - dirb
      - whois
      - samba-client   # smbclient
      - nmap-ncat
    state: present

- name: Install web exploitation packages
  become: true
  dnf:
    name:
      - sqlmap
    state: present

- name: Install password cracking packages
  become: true
  dnf:
    name:
      - hashcat
      - john
      - hydra
    state: present
  # Hinweis: hydra liegt in manchen Fedora-Versionen nicht in den
  # Standard-Repos. Falls der Task fehlschlägt, RPM Fusion aktivieren:
  # sudo dnf install rpmfusion-free-release rpmfusion-nonfree-release

- name: Install binary/pwn analysis packages
  become: true
  dnf:
    name:
      - gdb
      - radare2
      - binwalk
      - steghide
      - perl-Image-ExifTool
    state: present

- name: Ensure uv is present
  become: true
  dnf:
    name: uv
    state: present

- name: Install impacket via "uv tool" (stellt CLI-Skripte wie secretsdump.py bereit)
  ansible.builtin.command: "uv tool install impacket"
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/share/uv/tools/impacket"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

# pwntools wird meist per "from pwn import *" in eigenen Exploit-Skripten
# genutzt - dafür ist "uv tool install" ungeeignet (isoliert zu stark zum
# Importieren, genau wie bei pipx). Stattdessen ein dediziertes venv über
# uv, das man beim Exploiten aktiviert: source ~/tools/venv-pwntools/bin/activate

- name: Check if pwntools venv already exists
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/tools/venv-pwntools/bin/activate"
  register: pwntools_venv

- name: Create dedicated venv for pwntools via uv
  ansible.builtin.command: "uv venv {{ ansible_facts.user_dir }}/tools/venv-pwntools"
  when: not pwntools_venv.stat.exists

- name: Install pwntools into dedicated venv via uv
  ansible.builtin.command: "uv pip install pwntools"
  environment:
    VIRTUAL_ENV: "{{ ansible_facts.user_dir }}/tools/venv-pwntools"
  args:
    creates: "{{ ansible_facts.user_dir }}/tools/venv-pwntools/lib/*/site-packages/pwn"

- name: Add pwntools venv alias to bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/.bashrc"
    search_string: "alias pwnenv="
    line: "alias pwnenv='source {{ ansible_facts.user_dir }}/tools/venv-pwntools/bin/activate'"
    state: present

- name: Add uv tool bin directory to PATH
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/.bashrc"
    search_string: 'export PATH="$PATH:{{ ansible_facts.user_dir }}/.local/bin"'
    line: 'export PATH="$PATH:{{ ansible_facts.user_dir }}/.local/bin"'
    state: present

- name: Check if SecLists already cloned
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/tools/SecLists"
  register: seclists_installed

- name: Clone SecLists (Standard-Wordlists für HTB)
  ansible.builtin.git:
    repo: https://github.com/danielmiessler/SecLists.git
    depth: 1
    dest: "{{ ansible_facts.user_dir }}/tools/SecLists"
  when: not seclists_installed.stat.exists

- name: Check if exploitdb already cloned
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/tools/exploitdb"
  register: exploitdb_installed

- name: Clone exploitdb (liefert searchsploit)
  ansible.builtin.git:
    repo: https://gitlab.com/exploit-database/exploitdb.git
    depth: 1
    dest: "{{ ansible_facts.user_dir }}/tools/exploitdb"
  when: not exploitdb_installed.stat.exists

- name: Symlink searchsploit into PATH
  become: true
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/tools/exploitdb/searchsploit"
    dest: /usr/local/bin/searchsploit
    state: link
    force: yes
  when: not exploitdb_installed.stat.exists

- name: Add tools directory hints to bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/.bashrc"
    search_string: "export SECLISTS="
    line: "export SECLISTS={{ ansible_facts.user_dir }}/tools/SecLists"
    state: present

- name: Remind about manual installs (Metasploit, Burp Suite)
  ansible.builtin.debug:
    msg:
      - "Metasploit und Burp Suite werden hier bewusst NICHT automatisiert installiert:"
      - "- Metasploit: offizielles Install-Script von Rapid7 verwenden (curl https://raw.githubusercontent.com/rapid7/metasploit-omnibus/master/config/templates/metasploit-framework-wrappers/msfupdate.erb ...) oder via Flatpak/eigenes RPM"
      - "- Burp Suite: Download der Community Edition von portswigger.net (Fedora hat kein offizielles Paket)"
